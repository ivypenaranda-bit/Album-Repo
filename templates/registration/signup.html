{% extends 'base.html' %}
{% block content %}
<section class="auth-page py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="auth-card card shadow-sm">
        <div class="auth-header text-center mb-4">
          <div class="auth-badge">A</div>
          <h2>Create your account</h2>
          <p class="text-muted">Sign up to save albums, upload photos, and manage your gallery.</p>
        </div>
        <form method="post" class="auth-form">{% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary w-100">Sign Up</button>
        </form>
        <p class="auth-footer mt-4 text-center text-muted">Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
