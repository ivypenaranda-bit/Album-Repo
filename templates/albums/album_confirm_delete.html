{% extends 'base.html' %}
{% block content %}
<h1>Delete Album</h1>
<p>Are you sure you want to delete "{{ object.title }}"?</p>
<form method="post">{% csrf_token %}
  <button class="btn btn-danger">Confirm Delete</button>
  <a class="btn btn-secondary" href="{% url 'albums:album-detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
