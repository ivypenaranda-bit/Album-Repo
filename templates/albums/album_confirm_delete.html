{% extends 'base.html' %}
{% block hero %}{% endblock %}
{% block content %}
<div class="form-page py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="form-card p-5 shadow-sm rounded-4 text-center">
        <div style="width:56px; height:56px; margin:0 auto 1.5rem; display:flex; align-items:center; justify-content:center; border-radius:16px; background:rgba(220,53,69,.1);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 4 21 4 23 6 23 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"></polyline><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        </div>
        <h2 class="mb-2">Delete Album</h2>
        <p class="text-muted mb-4">Are you sure you want to delete <strong>{{ object.title }}</strong>? This action cannot be undone.</p>
        <form method="post" class="auth-form">{% csrf_token %}
          <button class="btn btn-danger w-100">Confirm Delete</button>
        </form>
        <a class="btn btn-outline-secondary w-100 mt-2" href="{% url 'albums:album-detail' object.pk %}">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
