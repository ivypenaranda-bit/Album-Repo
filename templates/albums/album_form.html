{% extends 'base.html' %}
{% block hero %}{% endblock %}
{% block content %}
<div class="form-page py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="form-card p-5 shadow-sm rounded-4">
        <h2 class="mb-2">{% if object %}Edit Album{% else %}Create Album{% endif %}</h2>
        <p class="text-muted mb-4">Add details for your album and publish it instantly.</p>
        <form method="post" class="auth-form">{% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary w-100 mt-2">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
