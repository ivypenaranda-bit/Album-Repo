{% extends 'base.html' %}
{% block content %}
<div class="form-page py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="form-card p-4 shadow-sm rounded-4">
        <h2 class="mb-3">Add Photo to {{ view.album.title }}</h2>
        <p class="text-muted mb-4">Upload a new image and optionally add a caption.</p>
        <form method="post" enctype="multipart/form-data">{% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary w-100">Upload</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
