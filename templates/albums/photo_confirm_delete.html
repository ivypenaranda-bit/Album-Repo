{% extends 'base.html' %}
{% block hero %}{% endblock %}
{% block content %}
<div class="form-page py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="form-card p-5 shadow-sm rounded-4">
        <h2 class="mb-3">Delete Photo</h2>
        <p class="text-muted mb-4">Are you sure you want to delete this photo? This action cannot be undone.</p>
        <form method="post" class="auth-form">{% csrf_token %}
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary flex-grow-1" href="{% url 'albums:album-detail' object.album.pk %}">Cancel</a>
            <button type="submit" class="btn btn-danger flex-grow-1">Delete Photo</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
